# Fine-tuning configuration. Paths are relative to this file. The base checkpoint
# and its immutable revision come from the baseline configuration.
baseline = "baseline.toml"
train = "../data/processed/train.jsonl"
validation = "../data/processed/validation.jsonl"
seed = 20261018

# The 256k-row token embedding is two thirds of mmBERT-base's parameters. Freezing
# it keeps every language the tokenizer covers intact and lets full fine-tuning of
# the transformer layers and decision head fit in 8 GB of GPU memory.
freeze_embeddings = true

# laya.train.TrainConfig fields; see the upstream docstring for their meaning.
[trainer]
# A 4-epoch run reached its lowest validation NLL after epoch 2 (0.451) and then
# overfit (0.509, 0.606), so the cosine schedule is fitted to 2 epochs.
epochs = 2
micro_batch = 32
grad_accum = 2
encoder_lr = 3e-5
head_lr = 1e-4
min_lr = 1e-6
weight_decay = 0.01
loss = "soft-ce"
# Present choice options in a random order each epoch so the model cannot learn
# a position prior (laya's documented order-flip failure).
shuffle_options = ["choice"]
label_smoothing = 0.05
max_len = 512
head_max_len = 256
amp = true
gradient_checkpointing = true
log_every = 200
