[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "laya-bangla"
version = "0.1.0"
description = "Reproducible Bangla evaluation and adaptation tools for Laya"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "shamspias", email = "shamsuddinpias0@gmail.com" }]
dependencies = [
  "laya==0.3.20",
  "torch==2.8.0",
  "transformers==4.57.6",
  "huggingface-hub==0.36.0",
  "numpy==2.5.3",
]

[project.scripts]
laya-bangla = "laya_bangla.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.14"]

[tool.uv]
cache-dir = ".cache/uv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
